name: ${COMPOSE_PROJECT_NAME:-myblog}

services:
  app:
    image: ${MYBLOG_IMAGE:-myblog:latest}
    build:
      context: .
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.server}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server}@${DB_HOST:-myblog-db}:${DB_PORT:-5432}/${POSTGRES_DB:?Set POSTGRES_DB in .env.server}?schema=public
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-myblog-db}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.server}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.server}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db-setup:
    profiles:
      - setup
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env.server}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server}@${DB_HOST:-myblog-db}:${DB_PORT:-5432}/${POSTGRES_DB:?Set POSTGRES_DB in .env.server}?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "db", "push"]
    restart: "no"

volumes:
  postgres-data:
